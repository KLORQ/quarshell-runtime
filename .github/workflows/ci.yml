name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quarshell-runtime
    steps:

      - name: Checkout quarshell-runtime
        uses: actions/checkout@v4
        with:
          path: quarshell-runtime

      - name: Checkout quarshell-core
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-core
          ref: v0.4.2
          path: quarshell-core

      - name: Checkout quarshell-driver
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-driver
          ref: v0.1.1
          path: quarshell-driver

      - name: Checkout quarshell-proxy
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proxy
          ref: v0.1.1
          path: quarshell-proxy

      - name: Checkout quarshell-slogx
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-slogx
          ref: v0.1.5
          path: quarshell-slogx
      - name: Checkout quarshell-proto workspace dependency
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proto
          ref: v0.2.2
          path: quarshell-proto
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            modules=()
            for d in quarshell-*; do
              [[ -f "$d/go.mod" ]] && modules+=("$d")
            done
            for d in "${modules[@]}"; do
              echo "  ./$d"
            done
            echo ')'
            echo 'replace ('
            for d in "${modules[@]}"; do
              module="$(sed -n 's/^module[[:space:]][[:space:]]*//p' "$d/go.mod" | head -n 1)"
              [[ -n "$module" ]] || continue
              for source in "${modules[@]}"; do
                awk -v module="$module" '$1 == module && $2 ~ /^v[0-9]/ { print $2 }; $1 == "require" && $2 == module && $3 ~ /^v[0-9]/ { print $3 }' "$source/go.mod"
              done | sort -u | while IFS= read -r version; do
                printf '  %s %s => ./%s\n' "$module" "$version" "$d"
              done
            done
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            quarshell-*/go.sum
            quarshell-slogx/go.sum
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quarshell-runtime
    steps:

      - name: Checkout quarshell-runtime
        uses: actions/checkout@v4
        with:
          path: quarshell-runtime

      - name: Checkout quarshell-core
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-core
          ref: v0.4.2
          path: quarshell-core

      - name: Checkout quarshell-driver
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-driver
          ref: v0.1.1
          path: quarshell-driver

      - name: Checkout quarshell-proxy
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proxy
          ref: v0.1.1
          path: quarshell-proxy

      - name: Checkout quarshell-slogx
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-slogx
          ref: v0.1.5
          path: quarshell-slogx
      - name: Checkout quarshell-proto workspace dependency
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proto
          ref: v0.2.2
          path: quarshell-proto
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            modules=()
            for d in quarshell-*; do
              [[ -f "$d/go.mod" ]] && modules+=("$d")
            done
            for d in "${modules[@]}"; do
              echo "  ./$d"
            done
            echo ')'
            echo 'replace ('
            for d in "${modules[@]}"; do
              module="$(sed -n 's/^module[[:space:]][[:space:]]*//p' "$d/go.mod" | head -n 1)"
              [[ -n "$module" ]] || continue
              for source in "${modules[@]}"; do
                awk -v module="$module" '$1 == module && $2 ~ /^v[0-9]/ { print $2 }; $1 == "require" && $2 == module && $3 ~ /^v[0-9]/ { print $3 }' "$source/go.mod"
              done | sort -u | while IFS= read -r version; do
                printf '  %s %s => ./%s\n' "$module" "$version" "$d"
              done
            done
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            quarshell-*/go.sum
            quarshell-slogx/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: quarshell-runtime
          args: --timeout=5m

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: quarshell-runtime
    steps:

      - name: Checkout quarshell-runtime
        uses: actions/checkout@v4
        with:
          path: quarshell-runtime

      - name: Checkout quarshell-core
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-core
          ref: v0.4.2
          path: quarshell-core

      - name: Checkout quarshell-driver
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-driver
          ref: v0.1.1
          path: quarshell-driver

      - name: Checkout quarshell-proxy
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proxy
          ref: v0.1.1
          path: quarshell-proxy

      - name: Checkout quarshell-slogx
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-slogx
          ref: v0.1.5
          path: quarshell-slogx
      - name: Checkout quarshell-proto workspace dependency
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proto
          ref: v0.2.2
          path: quarshell-proto
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            modules=()
            for d in quarshell-*; do
              [[ -f "$d/go.mod" ]] && modules+=("$d")
            done
            for d in "${modules[@]}"; do
              echo "  ./$d"
            done
            echo ')'
            echo 'replace ('
            for d in "${modules[@]}"; do
              module="$(sed -n 's/^module[[:space:]][[:space:]]*//p' "$d/go.mod" | head -n 1)"
              [[ -n "$module" ]] || continue
              for source in "${modules[@]}"; do
                awk -v module="$module" '$1 == module && $2 ~ /^v[0-9]/ { print $2 }; $1 == "require" && $2 == module && $3 ~ /^v[0-9]/ { print $3 }' "$source/go.mod"
              done | sort -u | while IFS= read -r version; do
                printf '  %s %s => ./%s\n' "$module" "$version" "$d"
              done
            done
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            quarshell-*/go.sum
            quarshell-slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...

  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: quarshell-runtime
    steps:

      - name: Checkout quarshell-runtime
        uses: actions/checkout@v4
        with:
          path: quarshell-runtime

      - name: Checkout quarshell-core
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-core
          ref: v0.4.2
          path: quarshell-core

      - name: Checkout quarshell-driver
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-driver
          ref: v0.1.1
          path: quarshell-driver

      - name: Checkout quarshell-proxy
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proxy
          ref: v0.1.1
          path: quarshell-proxy

      - name: Checkout quarshell-slogx
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-slogx
          ref: v0.1.5
          path: quarshell-slogx
      - name: Checkout quarshell-proto workspace dependency
        uses: actions/checkout@v4
        with:
          repository: KLORQ/quarshell-proto
          ref: v0.2.2
          path: quarshell-proto
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            modules=()
            for d in quarshell-*; do
              [[ -f "$d/go.mod" ]] && modules+=("$d")
            done
            for d in "${modules[@]}"; do
              echo "  ./$d"
            done
            echo ')'
            echo 'replace ('
            for d in "${modules[@]}"; do
              module="$(sed -n 's/^module[[:space:]][[:space:]]*//p' "$d/go.mod" | head -n 1)"
              [[ -n "$module" ]] || continue
              for source in "${modules[@]}"; do
                awk -v module="$module" '$1 == module && $2 ~ /^v[0-9]/ { print $2 }; $1 == "require" && $2 == module && $3 ~ /^v[0-9]/ { print $3 }' "$source/go.mod"
              done | sort -u | while IFS= read -r version; do
                printf '  %s %s => ./%s\n' "$module" "$version" "$d"
              done
            done
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            quarshell-*/go.sum
            quarshell-slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - name: Test (race + coverage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Test (race)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -count=1 ./...
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./quarshell-runtime/coverage.txt
          flags: unittests
          name: codecov-quarshell-runtime
          fail_ci_if_error: false
